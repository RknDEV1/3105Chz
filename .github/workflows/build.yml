name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build 3105 without code signing
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS app without signing
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          PRODUCTS="$DERIVED_DATA/Build/Products/Release-iphoneos"
          APP_PATH=""

          while IFS= read -r candidate; do
            [[ -d "$candidate" ]] || continue
            package_type=$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$candidate/Info.plist" 2>/dev/null || true)
            if [[ "$package_type" == "APPL" ]]; then
              APP_PATH="$candidate"
              break
            fi
          done < <(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' | sort)

          if [[ -z "$APP_PATH" ]]; then
            echo "No iOS app bundle found in $PRODUCTS"
            find "$PRODUCTS" -maxdepth 2 -print || true
            exit 1
          fi

          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/"
          (cd "$PACKAGE_DIR" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/3105-unsigned.ipa" Payload)
          echo "Created 3105-unsigned.ipa (unsigned; signing is required before installation)."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
