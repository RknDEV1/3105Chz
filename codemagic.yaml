workflows:
  ios-build:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
    scripts:
      - name: Build IPA (Unsigned)
        script: |
          # Descobre o nome do scheme automaticamente
          SCHEME=$(xcodebuild -list -project "$XCODE_PROJECT" | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          echo "Scheme detectado: $SCHEME"
          
          # Compila usando o scheme que ele achou
          xcodebuild -project "$XCODE_PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          
          # Empacota o IPA
          mkdir -p build/ipa/Payload
          cp -r build/Build/Products/Release-iphoneos/*.app build/ipa/Payload/
          cd build/ipa
          zip -r App.ipa Payload
    artifacts:
      - build/ipa/App.ipa
